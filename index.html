<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Pamphlets</title>
<meta name="theme-color" content="#1b2440">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
<style id="pageRule">@page{size:210mm 297mm;margin:0}</style>
<style>
/* Layout: a workbench. The editor sits in a column on the left; the paper pages on the right are exactly what the PDF will contain. */
:root{
  --desk:#e4e6eb; --panel:#ffffff; --panel2:#f3f4f7; --line:#d2d6dd; --text:#171a20; --muted:#5a6371;
  --accent:#2a55c4; --accent-ink:#ffffff; --danger:#b3261e; --ok:#1c7a46; --warn:#8a5a00;
  --ui:'Barlow',system-ui,'Segoe UI',Arial,sans-serif;
  --disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  /* the paper is always white, whatever the screen theme */
  --ink:#14171c; --ink2:#4c5463; --rule:#d4d8df; --tint:#f2f3f6;
}
@media (prefers-color-scheme:dark){
  :root{ --desk:#111317; --panel:#1b1e24; --panel2:#252930; --line:#383d47; --text:#e8eaee; --muted:#9aa3b1;
    --accent:#86a7ff; --accent-ink:#0c1222; --danger:#ff8a80; --ok:#6fd39b; --warn:#f0c36a; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--desk);color:var(--text);font:15px/1.4 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:700 21px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;margin-right:6px}
.grow{flex:1}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);width:100%}
textarea{resize:vertical;line-height:1.45;min-height:3.2em;display:block}
#pick{width:auto;max-width:250px;font-weight:600}
.saved{font-size:12.5px;color:var(--muted)}
.saved.bad{color:var(--danger)}
.delask{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
#bView,#bMore{display:none}
.extra{display:contents}

/* ---------- workbench ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr)}
.editor{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.tabs{flex:none;display:flex;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:none;padding:11px 11px 9px;cursor:pointer;font:600 15.5px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lab{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field small,.hint{font-size:12.5px;color:var(--muted);line-height:1.4;margin:0}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msg{font-size:13.5px;color:var(--muted)}
.msg.ok{color:var(--ok)} .msg.err{color:var(--danger)} .msg.warn{color:var(--warn)}
.note{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel2);padding:10px 12px;border-radius:6px;font-size:13.5px;line-height:1.45}
.note.warn{border-left-color:var(--warn)}
.note b{font-weight:600}
.h{margin:0;font:700 17px/1.1 var(--disp);letter-spacing:.07em;text-transform:uppercase}

.miss{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:9px;padding:11px}
.mrow{display:flex;gap:6px;align-items:center}
.mrow input{flex:1;min-width:0}

.dl{border:1px solid var(--line);border-radius:9px;padding:4px 11px 9px}
.dl h4{margin:10px 0 3px;font:700 13.5px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.dl-r{display:flex;align-items:center;gap:6px;font-size:14px;padding:1.5px 0}
.dl-r .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-r .mv{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.crown{border:0;background:none;cursor:pointer;padding:0 2px;font-size:15px;line-height:1;color:var(--line);border-radius:4px}
.crown:hover{color:var(--muted)}
.crown.on{color:#c79a1e}

.item{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.item>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:9px 10px;cursor:pointer;border-radius:10px}
.item>summary::-webkit-details-marker{display:none}
.item>summary::before{content:"▸";color:var(--muted);font-size:12px;width:10px}
.item[open]>summary::before{content:"▾"}
.item .tagn{flex:none;font:700 13px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
.item .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item .tools{display:flex;gap:2px}
.icon{border:0;background:none;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--muted);font-size:15px;line-height:1}
.icon:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.icon:disabled{opacity:.3;cursor:default}
.icon.del:hover{color:var(--danger)}
.item .in{padding:4px 12px 13px;display:flex;flex-direction:column;gap:11px}

.picker{position:relative;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 3px 3px 4px;font-size:13.5px;max-width:100%}
.chip img{width:19px;height:26px;border-radius:2px;object-fit:cover;flex:none}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 5px;border-radius:4px}
.chip .x:hover{color:var(--danger)}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);max-height:270px;overflow:auto}
.opt{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.opt small{color:var(--muted);font-size:12px;white-space:nowrap}
.opt.on{background:var(--accent);color:var(--accent-ink)}
.opt.on small{color:inherit;opacity:.85}
.opt.none{cursor:default;color:var(--muted)}

.secrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 10px}
.secrow .check{flex:1;min-width:0}

.preview{min-width:0;min-height:0;overflow:auto;padding:22px}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px}
#stage{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;background:#1d2129;color:#fff;padding:10px 14px;border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;font-size:14px;max-width:min(92vw,560px)}
.toast button{border:0;background:none;color:#9dbcff;font-weight:600;cursor:pointer;padding:2px 4px}

@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .editor{border-right:0}
  .preview{display:none}
  body.pv .editor{display:none}
  body.pv .preview{display:block}
  #bView,#bMore{display:inline-block}
  .saved{display:none}
  .bar{gap:7px;padding:8px 12px}
  .brand{font-size:18px}
  #pick{flex:1 1 55%;max-width:none;min-width:0}
  .extra{display:none}
  body.more .extra{display:flex;flex-wrap:wrap;gap:7px;order:9;width:100%}
  body.more #bMore{background:var(--panel2);border-color:var(--muted)}
}

/* ---------- the paper ---------- */
.sheet{--pw:210mm;--ph:297mm;--mx:13mm;--mt:12mm;--mb:12mm;--fs:9.6pt}
.sheet[data-size="letter"]{--pw:215.9mm;--ph:279.4mm}
.sheet[data-size="a5"]{--pw:148mm;--ph:210mm;--mx:9mm;--mt:9mm;--mb:10mm;--fs:8.4pt}
.pagewrap{flex:none;width:calc(var(--pw)*var(--s,1));height:calc(var(--ph)*var(--s,1));overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.18)}
.page{width:var(--pw);height:var(--ph);transform:scale(var(--s,1));transform-origin:0 0;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff;color:var(--ink);font:400 var(--fs)/1.42 var(--ui);text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page img{max-width:none}
.page .content{flex:1 1 0;min-height:0;margin:var(--mt) var(--mx) 2.5mm;position:relative}
.page .content>:first-child{margin-top:0!important;padding-top:0!important;border-top:0!important}
.page .pfoot{flex:none;height:var(--mb);margin:0 var(--mx);border-top:.2mm solid var(--rule);padding-top:1.5mm;display:flex;justify-content:space-between;align-items:flex-start;gap:4mm;font-size:.66em;line-height:1.2;color:var(--ink2);letter-spacing:.02em}
.page .pfoot .t{font-weight:600;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .pfoot .fine{flex:1;text-align:center;opacity:.85}
.page .pfoot .pg{font-variant-numeric:tabular-nums;white-space:nowrap}

.page .card{display:block;flex:none;aspect-ratio:488/680;border-radius:4.6%/3.3%;background:#cfd3da;object-fit:cover}
.page span.card{display:flex;align-items:center;justify-content:center;text-align:center;padding:1mm;font-size:.74em;line-height:1.2;color:var(--ink2);border:.25mm dashed #9aa1ad;background:var(--tint)}
.page .ms{display:inline-block;width:1em;height:1em;vertical-align:-.14em;margin:0 .03em}
.page .cn{font-weight:600}

.page .cover{position:relative;flex:none;min-height:calc(var(--pw)*.36);background:#12151b;color:#fff;display:flex;align-items:flex-end;gap:6mm;padding:10mm var(--mx) 8mm;overflow:hidden}
.page .cover .art{position:absolute;inset:0;display:flex}
.page .cover .art img{flex:1 1 0;width:0;min-width:0;height:100%;object-fit:cover;object-position:50% 20%}
.page .cover .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,16,21,.95),rgba(14,16,21,.84) 40%,rgba(14,16,21,.36) 76%,rgba(14,16,21,.52))}
.page .cover .txt{position:relative;flex:1 1 0;min-width:0}
.page .cover .eyebrow{display:flex;align-items:center;gap:2.6mm;flex-wrap:wrap;margin-bottom:3mm}
.page .badge{font:600 .86em/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;border:.3mm solid rgba(255,255,255,.85);padding:1.3mm 2.4mm 1.1mm;border-radius:1mm;white-space:nowrap}
.page .badge i{font-style:normal;opacity:.78;margin-left:2.2mm}
.page .pips{display:flex;gap:.8mm}
.page .pips img{width:1.36em;height:1.36em;display:block}
.page .cover h1{margin:0;font:700 3.25em/.95 var(--disp);letter-spacing:.006em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.page .cover .tag{margin:2.6mm 0 0;font-size:1.1em;line-height:1.3;max-width:34em;opacity:.93}
.page .cover .meta{margin:3mm 0 0;font-weight:500;font-size:.92em;line-height:1.3;opacity:.9;display:flex;gap:1mm 5mm;flex-wrap:wrap}
.page .cover .meta b{font:600 .82em var(--disp);letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-right:1.5mm}
.page .cover .cmd{position:relative;flex:none;display:flex}
.page .cover .cmd .card{width:calc(var(--pw)*.205);box-shadow:0 1mm 5mm rgba(0,0,0,.55)}
.page .cover .cmd.two .card{width:calc(var(--pw)*.178)}
.page .cover .cmd.two .card+.card{margin-left:calc(var(--pw)*-.022)}
.page .cover .credit{position:absolute;right:var(--mx);bottom:2.3mm;font-size:.56em;opacity:.7;letter-spacing:.03em}
.page .stripe{flex:none;height:1.5mm;display:flex}
.page .stripe i{flex:1}

.page .sec{margin:7mm 0 0;display:flex;align-items:center;gap:3mm;font:700 1.62em/1 var(--disp);letter-spacing:.05em;text-transform:uppercase}
.page .sec::after{content:"";flex:1;height:.4mm;background:var(--ink)}
.page .sec small{order:1;font:500 .5em/1 var(--ui);letter-spacing:.07em;color:var(--ink2)}

.page .prose{margin-top:3.2mm;columns:var(--pcols,2);column-gap:7mm}
.page .prose.one{max-width:64%}
.sheet[data-size="a5"] .page .prose.one{max-width:none}
.page .prose p{margin:0 0 .75em;orphans:2;widows:2}
.page .prose h3{margin:1.1em 0 .35em;font:700 1.2em/1.1 var(--disp);letter-spacing:.06em;text-transform:uppercase;break-after:avoid}
.page .prose>h3:first-child{margin-top:0}
.page .prose ul{margin:0 0 .75em;padding-left:1.25em}
.page .prose li{margin:0 0 .25em;break-inside:avoid}
.page .prose>:last-child{margin-bottom:0}
.page .empty{margin-top:8mm;color:var(--ink2);font-size:1.1em;max-width:30em}

.page .combo,.page .top{margin-top:4mm;padding-top:4mm;border-top:.2mm solid var(--rule);display:flex;gap:5mm;align-items:flex-start}
.page .top{gap:4mm}
.page .sec+.combo,.page .sec+.top{margin-top:3.6mm;padding-top:0;border-top:0}
.page .imgs{flex:none;display:flex;flex-wrap:wrap;gap:1.4mm;max-width:58%}
.page .combo .imgs .card{width:calc(var(--pw)*.118)}
.page .combo .imgs.n4 .card,.page .combo .imgs.n5 .card{width:calc(var(--pw)*.096)}
.page .top .imgs .card{width:calc(var(--pw)*.15)}
.page .top .imgs.n3 .card{width:calc(var(--pw)*.13)}
.page .top .imgs.n4 .card,.page .top .imgs.n5 .card{width:calc(var(--pw)*.108)}
.page .body{flex:1 1 0;min-width:0}
.page .eb{font:600 .8em/1 var(--disp);letter-spacing:.17em;text-transform:uppercase;color:var(--ink2);margin-bottom:1.1mm}
.page .body h4{margin:0 0 1.6mm;font:700 1.42em/1.05 var(--disp);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.page .body p{margin:0 0 1.5mm}
.page .plab{font:600 .8em var(--disp);letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);margin-right:1.6mm}
.page .combo ol{margin:0 0 1.5mm;padding-left:1.5em}
.page .combo li{margin-bottom:.7mm;padding-left:.2em}
.page .combo li::marker{font:700 1em var(--disp)}
.page .res{font-weight:600}
.page .body>:last-child{margin-bottom:0}
.page .num{flex:none;width:1.3em;font:700 3.6em/.8 var(--disp);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.page .deckcols{margin-top:3.2mm;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));column-gap:6mm;align-items:start}
.page .dg{height:var(--gh);margin-top:var(--gg);display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:1mm;border-bottom:.3mm solid var(--ink);font:700 1em/1 var(--disp);letter-spacing:.08em;text-transform:uppercase}
.page .dcol>.dg:first-child{margin-top:0}
.page .dg span,.page .dg i{font:500 .86em/1 var(--ui);font-style:normal;letter-spacing:.04em;color:var(--ink2)}
.page .dr{height:var(--rh);display:flex;align-items:center;gap:1.5mm;font-size:.9em;line-height:1;border-bottom:.15mm solid var(--rule)}
.page .dr .nm{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.4mm 0}
.page .dr .q{color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:.5mm}
.page .dr .cost{flex:none;display:flex;align-items:center;gap:.25mm}
.page .dr .cost .ms{width:2.85mm;height:2.85mm;margin:0;vertical-align:0}
.page .dr .cost .sl{font-style:normal;font-size:.8em;color:var(--ink2);margin:0 .4mm}

@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;display:block!important}
  .bar,.editor,.toast,#stage{display:none!important}
  .work{display:block!important}
  .preview{display:block!important;overflow:visible!important;padding:0!important}
  #pages{display:block!important;--s:1!important}
  .pagewrap{width:var(--pw)!important;height:calc(var(--ph) - .4mm)!important;box-shadow:none!important;break-after:page;break-inside:avoid}
  .pagewrap:last-child{break-after:auto}
  .page{transform:none!important}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Deck Pamphlets</div>
  <select id="pick" aria-label="Choose a pamphlet"></select>
  <button class="btn" id="bNew" type="button">New deck</button>
  <span class="extra">
    <button class="btn ghost" id="bDup" type="button">Duplicate</button>
    <span id="delwrap"><button class="btn ghost" id="bDel" type="button">Delete</button></span>
    <button class="btn ghost" id="bOpen" type="button" title="Open a pamphlet file saved with “Save to file”, for example from your other device">Open file</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button class="btn ghost" id="bSave" type="button" title="Save this pamphlet as a file: a backup, or to move it to another device">Save to file</button>
  </span>
  <button class="btn ghost" id="bMore" type="button" aria-expanded="false">More</button>
  <span class="grow"></span>
  <span id="saved" class="saved"></span>
  <button class="btn ghost" id="bView" type="button">Preview</button>
  <button class="btn primary" id="bPdf" type="button" title="Opens the print window. Choose “Save as PDF” as the printer.">Save as PDF</button>
</header>
<main class="work">
  <section class="editor" aria-label="Editor">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="panel" id="panel"></div>
  </section>
  <section class="preview" id="preview" aria-label="Pamphlet pages">
    <div id="pages" class="sheet"></div>
  </section>
</main>
<div id="stage" class="sheet" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS='deckPamphlets.v1';
const MM=96/25.4;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};

const SIZES={a4:[210,297,'A4'],letter:[215.9,279.4,'US Letter'],a5:[148,210,'A5 (small booklet)']};
const BR={1:'Exhibition',2:'Core',3:'Upgraded',4:'Optimized',5:'cEDH'};
const CI={W:'#e3d48a',U:'#1b7fd1',B:'#3a3340',R:'#d8402f',G:'#1f8f4f',C:'#a7afb9'};

const HEADS={commander:'cmd',commanders:'cmd','command zone':'cmd',companion:'side',deck:'main',main:'main',mainboard:'main','main board':'main','main deck':'main',maindeck:'main',sideboard:'side','side board':'side',side:'side',maybeboard:'maybe','maybe board':'maybe',maybe:'maybe',considering:'maybe',wishlist:'maybe',tokens:'maybe',about:'about'};

function parseDeck(text){

  const keepBoard=b=>(b==='cmd'||b==='about')?'main':b;
  let board='main',title='';const map=new Map();
  for(let line of lines){
    if(!line) continue;
    let m;
    if((m=line.match(/^\/\/+\s*(?:deck ?)?name\s*:\s*(.+)$/i))){title=m[1].trim();continue}
    if(/^\/\//.test(line)){const t=line.replace(/^\/+\s*/,'').replace(/\s*[\[(]\d+[\])]\s*$/,'').replace(/:$/,'').trim().toLowerCase();board=HEADS[t]||(/^side/.test(t)?'side':/^maybe/.test(t)?'maybe':'main');continue}
    if(/^#/.test(line)) continue;
    let side=false;

      if(board==='about'){if((m=line.match(/^name\s+(.+)$/i)))title=m[1].trim();continue}
      if(strict){board=keepBoard(board);continue}
    }
    if(board==='about') continue;

    const hi=line.indexOf('#');
    if(hi>=0){if(/!\s*commander/i.test(line.slice(hi)))cmd=true;line=line.slice(0,hi)}
    if(/\*CMDR\*/i.test(line)) cmd=true;
    line=line.replace(/\*[^*]*\*/g,' ').replace(/\^[^^]*\^/g,' ').replace(/<[^>]*>/g,' ');
    line=line.replace(/\s\[([^\]]*)\]\s*$/,(_,c)=>{if(/commander/i.test(c))cmd=true;if(/maybe/i.test(c))maybe=true;else if(/sideboard/i.test(c))side=true;return ' '});
    if((m=line.match(/^(.*?)\s+\(([A-Za-z0-9]{2,6})\)(?:\s+\S+)?\s*$/))){line=m[1];if(!set)set=m[2]}

    if(!name||(maybe&&!cmd)) continue;

  }
  return {entries:[...map.values()],title};
}

  if(inFrame) return 'Could not reach Scryfall. This looks like a preview inside another app, which may block the internet. Open the app in Chrome or Edge instead.';

async function resolveEntries(entries,prog,onWait){

      const j=await sfPost(part.map(e=>useSet&&e.set?{name:e.front,set:e.set}:{name:e.front}),onWait);
      const idx=new Map();
      for(const c of j.data||[]){
        [c.name,c.name.split(' // ')[0],...(c.card_faces||[]).map(f=>f.name)].forEach((n,x)=>{const k=norm(n);if(x<2||!idx.has(k))idx.set(k,c)});
      }
      for(const e of part){const c=idx.get(norm(e.front))||idx.get(norm(e.name));if(c)found.set(e,c)}

  for(const [k,label] of GROUPS){
    const items=by[k];if(!items) continue;
    items.sort((a,b)=>{const A=P.cards[a.k],B=P.cards[b.k];return (B.mv-A.mv)||A.n.localeCompare(B.n,'en',{sensitivity:'base'})});
    const count=items.reduce((s,e)=>s+e.q,0);
    out.push({k,label:k==='commander'&&count>1?'Commanders':label,count,items});
  }
  return out;
}

/* ================= text formatting ================= */
const SYM=/^(?:\d{1,2}|[WUBRGCXYZSTQE]|[WUBRGC2]\/[WUBRGP]|[WUBRG]\/[WUBRG]\/P|∞|½)$/i;
function sym(x){
  const code=x.toUpperCase().replace(/\//g,'').replace('∞','INFINITY').replace('½','HALF');
  return `<img class="ms" src="https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg" alt="{${esc(x)}}">`;
}
function costHtml(cost){
  if(!cost) return '';
  return cost.split(' // ').map(part=>(part.match(/\{[^}]+\}/g)||[]).map(s=>sym(s.slice(1,-1))).join('')).filter(Boolean).join('<i class="sl">//</i>');
}
function inline(s){
  s=esc(s);
  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,n)=>{const c=P.cards[norm(n.replace(/&#39;/g,"'").replace(/&amp;/g,'&'))];return `<span class="cn">${c?esc(c.n):n}</span>`});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
  s=s.replace(/\{([^{}\s]{1,5})\}/g,(m,x)=>SYM.test(x)?sym(x):m);
  return s;
}
function paras(text){
  return String(text||'').replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean)
    .map(b=>`<p>${b.split('\n').map(l=>inline(l.trim())).join('<br>')}</p>`).join('');
}
function proseEls(text){
  const out=[],special=/^(#{1,3}|[-*•])\s+/;
  for(const blk of String(text||'').replace(/\r/g,'').split(/\n\s*\n/)){
    const lines=blk.split('\n').map(l=>l.trim()).filter(Boolean);
    let i=0;
    while(i<lines.length){
      const l=lines[i];
      if(/^#{1,3}\s+/.test(l)){out.push(h(`<h3>${inline(l.replace(/^#+\s+/,''))}</h3>`));i++;continue}
      if(/^[-*•]\s+/.test(l)){
        const items=[];
        while(i<lines.length&&/^[-*•]\s+/.test(lines[i])){items.push(lines[i].replace(/^[-*•]\s+/,''));i++}
        out.push(h(`<ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`));continue;
      }
      const ps=[];
      while(i<lines.length&&!special.test(lines[i])){ps.push(lines[i]);i++}
      out.push(h(`<p>${ps.map(inline).join('<br>')}</p>`));
    }
  }
  return out;
}

function cardImg(k){
  const c=P.cards[k];
  if(!c||!c.img) return `<span class="card">${esc(c?c.n:k)}</span>`;
  return `<img class="card" src="${esc(c.img)}" alt="${esc(c.n)}">`;
}
function identity(){
  const cmds=P.deck.filter(e=>e.cmd),src=cmds.length?cmds:P.deck;
  if(!src.length) return null;
  const s=new Set();
  src.forEach(e=>String((P.cards[e.k]||{}).ci||'').split('').forEach(c=>s.add(c)));
  const o='WUBRG'.split('').filter(c=>s.has(c));
  return o.length?o:['C'];
}
function coverEls(){
  const cmds=P.deck.filter(e=>e.cmd).map(e=>P.cards[e.k]).filter(Boolean).slice(0,2);
  const cmdNames=cmds.map(c=>c.n).join(' & ');
  const title=P.title.trim()||cmdNames||'Untitled deck';
  const ci=identity();
  const arts=cmds.filter(c=>c.art);
  const meta=[];
  if(cmdNames&&P.title.trim()) meta.push(`<span><b>Commander${cmds.length>1?'s':''}</b>${esc(cmdNames)}</span>`);
  if(P.author.trim()) meta.push(`<span><b>Deck by</b>${esc(P.author.trim())}</span>`);
  const eyebrow=(P.bracket&&BR[P.bracket]?`<span class="badge">Bracket ${esc(P.bracket)}<i>${BR[P.bracket]}</i></span>`:'')+(ci?`<span class="pips">${ci.map(sym).join('')}</span>`:'');
  const cover=h(`<div class="cover">
    ${arts.length?`<div class="art">${arts.map(c=>`<img src="${esc(c.art)}" alt="">`).join('')}</div>`:''}
    <div class="shade"></div>
    <div class="txt">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${esc(title)}</h1>
      ${P.tagline.trim()?`<p class="tag">${inline(P.tagline.trim())}</p>`:''}
      ${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>
    ${cmds.length?`<div class="cmd${cmds.length>1?' two':''}">${cmds.map(c=>c.img?`<img class="card" src="${esc(c.img)}" alt="${esc(c.n)}">`:'').join('')}</div>`:''}
    ${arts.length?`<div class="credit">Art: ${esc([...new Set(arts.map(c=>c.artist).filter(Boolean))].join(' / '))}</div>`:''}
  </div>`);
  const stripe=h(`<div class="stripe">${(ci||['C']).map(c=>`<i style="background:${CI[c]}"></i>`).join('')}</div>`);
  return [cover,stripe];
}
function comboEl(c,i){
  const n=(c.cards||[]).length;
  const steps=String(c.steps||'').split(/\n+/).map(s=>s.trim().replace(/^(\d+[.)]|[-*•])\s+/,'')).filter(Boolean);
  return h(`<div class="combo" data-ref="combos.${i}">${n?`<div class="imgs n${Math.min(n,5)}">${c.cards.map(cardImg).join('')}</div>`:''}<div class="body">
    <div class="eb">Line ${i+1}</div><h4>${inline(c.title||c.cards.map(k=>(P.cards[k]||{}).n||k).join(' + ')||'Untitled line')}</h4>
    ${String(c.needs||'').trim()?`<p><span class="plab">Needs</span>${inline(c.needs.trim()).replace(/\n/g,'<br>')}</p>`:''}
    ${steps.length?`<ol>${steps.map(s=>`<li>${inline(s)}</li>`).join('')}</ol>`:''}
    ${String(c.result||'').trim()?`<p class="res"><span class="plab">Result</span>${inline(c.result.trim())}</p>`:''}
  </div></div>`);
}
function topEl(t,num,i){
  const n=(t.cards||[]).length;
  return h(`<div class="top" data-ref="top.${i}"><div class="num">${num}</div>${n?`<div class="imgs n${Math.min(n,5)}">${t.cards.map(cardImg).join('')}</div>`:''}<div class="body">
    <h4>${inline(t.title||t.cards.map(k=>(P.cards[k]||{}).n||k).join(' & ')||'Untitled')}</h4>${paras(t.text)}</div></div>`);
}
function deckItems(){
  const list=[];
  for(const g of groupedDeck()){list.push({h:1,label:g.label,count:g.count});for(const e of g.items)list.push({e,g:g.label})}
  return list;
}
function buildFlow(){
  const flow=[];
  for(const s of P.sections){
    if(!s.on) continue;
    let part=[],extra='';
    if(s.k==='writeup'){
      const els=proseEls(P.writeup);
      if(els.length) part=[{prose:els,cols:(P.size==='a5'||P.writeup.length<700)?1:2}];
    }else if(s.k==='combos') part=P.combos.map((c,i)=>({el:comboEl(c,i)}));
    else if(s.k==='top') part=P.top.map((t,i)=>({el:topEl(t,P.countdown?P.top.length-i:i+1,i)}));
    else if(s.k==='deck'&&P.deck.length){
      const n=P.deck.reduce((a,e)=>a+e.q,0);
      extra=`<small>${n} cards</small>`;part=[{deck:deckItems()}];
    }
    if(!part.length) continue;
    if(P.newPage&&flow.length) flow.push({br:1});
    const head=h(`<h2 class="sec">${esc(P.titles[s.k]||SECNAME[s.k])}${extra}</h2>`);
    head.dataset.keep='1';head.dataset.sec=s.k;
    flow.push({el:head},...part);
  }
  return flow;
}
function fillCols(list,cap,RH,GH,GG){
  const cols=[];let cur,used;
  const start=()=>{cur=[];cols.push(cur);used=0};
  start();
  for(const it of list){
    const need=it.h?GH+(cur.length?GG:0)+RH:RH;
    if(used+need>cap&&cur.length) start();
    if(!cur.length&&!it.h){cur.push({h:1,label:it.g,cont:1});used+=GH}
    used+=it.h?GH+(cur.length?GG:0):RH;
    cur.push(it);
  }
  return cols;
}
function paginate(stage){
  stage.dataset.size=P.size;stage.replaceChildren();
  const pages=[];let page,content;
  const newPage=()=>{page=h('<div class="pagewrap"><div class="page"><div class="content"></div><div class="pfoot"></div></div></div>');stage.appendChild(page);content=$('.content',page);pages.push(page)};
  const over=()=>content.scrollHeight>content.clientHeight+1;
  const hasCover=()=>!!$('.cover',page);
  const takeHead=()=>{const last=content.lastElementChild;if(last&&last.dataset.keep){last.remove();return last}return null};
  newPage();
  const [cov,stripe]=coverEls();
  page.firstElementChild.insertBefore(stripe,content);page.firstElementChild.insertBefore(cov,stripe);

  function placeBlock(el){
    content.appendChild(el);
    if(!over()||content.children.length===1) return;
    el.remove();
    const carry=takeHead();
    if(!content.children.length&&!hasCover()){if(carry)content.appendChild(carry);content.appendChild(el);return}
    newPage();if(carry)content.appendChild(carry);content.appendChild(el);
  }
  function placeProse(els,cols){
    let rest=els.slice();
    while(rest.length){
      const box=h(`<div class="prose${cols===1?' one':''}" style="--pcols:${cols}"></div>`);
      box.append(...rest);content.appendChild(box);
      if(!over()) return;
      let lo=0,hi=rest.length-1;
      while(lo<hi){const mid=Math.ceil((lo+hi)/2);box.replaceChildren(...rest.slice(0,mid));if(over())hi=mid-1;else lo=mid}
      let k=lo;
      while(k>0&&rest[k-1].tagName==='H3') k--;
      if(k===0){
        box.remove();
        const kids=content.children.length,onlyHead=kids===1&&content.firstElementChild.dataset.keep;
        if((kids===0||onlyHead)&&!hasCover()){
          const b2=h(`<div class="prose${cols===1?' one':''}" style="--pcols:${cols}"></div>`);
          b2.appendChild(rest[0]);content.appendChild(b2);rest=rest.slice(1);
          if(rest.length) newPage();
          continue;
        }
        const carry=takeHead();newPage();if(carry)content.appendChild(carry);
        continue;
      }
      box.replaceChildren(...rest.slice(0,k));rest=rest.slice(k);newPage();
    }
  }
  function placeDeck(list){
    const small=P.size==='a5',N=small?2:3,RH=small?4.1:4.5,GH=small?6:6.6,GG=small?2.2:2.8;
    let rest=list,guard=0;
    while(rest.length&&guard++<40){
      const box=h(`<div class="deckcols" style="--cols:${N};--rh:${RH}mm;--gh:${GH}mm;--gg:${GG}mm"></div>`);
      content.appendChild(box);
      const avail=(content.getBoundingClientRect().bottom-box.getBoundingClientRect().top)/MM-.6;
      const fresh=content.children.length===1||(content.children.length===2&&content.firstElementChild.dataset.keep&&!hasCover());
      if(avail<GH+RH*7&&!fresh){box.remove();const carry=takeHead();newPage();if(carry)content.appendChild(carry);continue}
      let cols=fillCols(rest,avail,RH,GH,GG);
      if(cols.length<=N){
        const total=rest.reduce((s,it)=>s+(it.h?GH+GG:RH),0);
        let lo=Math.min(avail,Math.max(GH+RH,total/N-GH)),hi=avail;
        for(let i=0;i<16;i++){const mid=(lo+hi)/2;if(fillCols(rest,mid,RH,GH,GG).length<=N)hi=mid;else lo=mid}
        cols=fillCols(rest,hi,RH,GH,GG);rest=[];
      }else{rest=cols.slice(N).flat().filter(it=>!it.cont);cols=cols.slice(0,N)}
      box.innerHTML=cols.map(col=>`<div class="dcol">${col.map(it=>{
        if(it.h) return `<div class="dg">${esc(it.label)}${it.cont?'<i>continued</i>':`<span>${it.count}</span>`}</div>`;
        const c=P.cards[it.e.k];
        return `<div class="dr"><span class="nm">${esc(c.n)}${it.e.q>1?` <span class="q">×${it.e.q}</span>`:''}</span><span class="cost">${costHtml(c.c)}</span></div>`;
      }).join('')}</div>`).join('');
      if(rest.length) newPage();
    }
  }

  const flow=buildFlow();
  if(!flow.length) content.appendChild(h('<p class="empty">Your pamphlet shows up here as you fill it in. Start on the Deck tab: paste your decklist and press Load cards.</p>'));
  for(const it of flow){
    if(it.br){if(content.children.length)newPage();continue}
    if(it.el) placeBlock(it.el);
    else if(it.prose) placeProse(it.prose,it.cols);
    else if(it.deck) placeDeck(it.deck);
  }
  const title=pamName(P);
  pages.forEach((pg,i)=>{$('.pfoot',pg).innerHTML=`<span class="t">${esc(title)}</span><span class="fine">Unofficial fan content · card images © Wizards of the Coast, via Scryfall</span><span class="pg">${i+1} / ${pages.length}</span>`});
  return pages;
}
function fitPreview(){
  const pv=$('#preview'),w=pv.clientWidth-44;
  if(w<60) return;
  $('#pages').style.setProperty('--s',Math.min(1.15,w/(SIZES[P.size][0]*MM)).toFixed(4));
}
function reveal(sel,always){
  const pv=$('#preview');
  if(!pv.offsetParent) return true;
  if(!sel){pv.scrollTo({top:0,behavior:'smooth'});return true}
  const el=$(sel,$('#pages'));if(!el) return false;
  const r=el.getBoundingClientRect(),pr=pv.getBoundingClientRect();
  if(always||r.top<pr.top+8||r.bottom>pr.bottom-8) pv.scrollTo({top:Math.max(0,pv.scrollTop+r.top-pr.top-26),behavior:'smooth'});
  return true;
}
function renderPreview(){
  clearTimeout(prevT);
  const stage=$('#stage'),live=$('#pages');
  paginate(stage);
  // keep the pictures already on screen, so typing never makes them blink
  const pool=new Map();
  $$('img',live).forEach(im=>{const a=pool.get(im.src)||[];a.push(im);pool.set(im.src,a)});
  $$('img',stage).forEach(im=>{const a=pool.get(im.src);if(a&&a.length){const old=a.pop();old.className=im.className;old.alt=im.alt;im.replaceWith(old)}});
  live.dataset.size=P.size;
  live.replaceChildren(...stage.children);
  const [w,hh]=SIZES[P.size];
  $('#pageRule').textContent=`@page{size:${w}mm ${hh}mm;margin:0}`;
  fitPreview();
  if(ui.want){const w2=ui.want;ui.want=null;reveal(w2)}
}

    return `${fText('Section title','titles.top')}
    ${fCheck('Count down, so number 1 comes last','countdown')}
    ${P.top.map((t,i)=>`<details class="item" data-id="${t.id}" data-ref="top.${i}" ${ui.closed.has(t.id)?'':'open'}>
      <summary><span class="tagn">#${P.countdown?n-i:i+1}</span><span class="st" id="st-top-${i}">${esc(t.title||t.cards.map(k=>(P.cards[k]||{}).n||k).join(' & ')||'Untitled')}</span>${itemTools('top',i,n)}</summary>
      <div class="in">
        ${fText('Title',`top.${i}.title`,'Leave empty to use the card name')}
        ${picker(`top.${i}.cards`,'Cards shown (one or more)')}
        ${fArea('Description',`top.${i}.text`,4,'Why is this card here? How is it used?')}
      </div></details>`).join('')}
    <div class="row"><button type="button" class="btn" data-act="add-top">+ Add an entry</button>${n?'':'<button type="button" class="btn" data-act="add-top10">+ Add 10 empty entries</button>'}</div>
    <p class="hint">${INLINE_HINT}</p>`;
  },
  pages(){
    return `
    <label class="field"><span>Paper size</span><select id="f-size" data-bind="size">${Object.keys(SIZES).map(k=>`<option value="${k}" ${P.size===k?'selected':''}>${SIZES[k][2]}</option>`).join('')}</select>
      <small>A4 suits printing. A5 has larger text for its size, which reads better on a phone.</small></label>
    ${fCheck('Start every section on a new page','newPage')}
    <div class="field"><span>Sections and their order</span>
      ${P.sections.map((s,i)=>`<div class="secrow">${fCheck(esc(P.titles[s.k]||SECNAME[s.k]),`sections.${i}.on`)}<span class="tools"><button type="button" class="icon" data-act="up" data-path="sections" data-i="${i}" aria-label="Move up" title="Move up" ${i?'':'disabled'}>↑</button><button type="button" class="icon" data-act="down" data-path="sections" data-i="${i}" aria-label="Move down" title="Move down" ${i<P.sections.length-1?'':'disabled'}>↓</button></span></div>`).join('')}
      <small>A section with nothing in it is left out automatically.</small></div>
    <div class="note"><b>Making the PDF.</b> Press <b>Save as PDF</b> at the top. In the print window that opens, choose <b>Save as PDF</b> as the printer (on a computer, “Microsoft Print to PDF” also works), then save. The pages on the right are exactly what you get.</div>`;
  }
};
const panel=$('#panel');
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${l}</button>`).join('');
}
function renderEditor(){
  const ae=document.activeElement,id=ae&&panel.contains(ae)?ae.id:'',st=panel.scrollTop;
  panel.innerHTML=TABHTML[ui.tab]();
  panel.scrollTop=st;
  if(id){const el=document.getElementById(id);if(el)el.focus({preventScroll:true})}
}
function renderPick(){
  const list=Object.values(DB.items).sort((a,b)=>b.updated-a.updated);
  $('#pick').innerHTML=list.map(p=>`<option value="${p.id}" ${p.id===P.id?'selected':''}>${esc((p.example?'Example: ':'')+pamName(p))}</option>`).join('');
}
function renderAll(){renderPick();renderTabs();renderEditor();renderPreview()}
function openPam(id){
  if(!DB.items[id]) return;
  P=DB.items[id];DB.current=id;ui.closed.clear();ui.deckMsg=null;
  saveNow();renderAll();panel.scrollTop=0;
}
let toastT=0;
function toast(msg,ms=4000,actLabel,fn){
  const t=$('#toast');clearTimeout(toastT);
  t.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button type="button">${esc(actLabel)}</button>`:''}`;
  if(actLabel) $('button',t).onclick=()=>{t.hidden=true;fn()};
  t.hidden=false;toastT=setTimeout(()=>{t.hidden=true},ms);
}

/* picking cards */
function suggest(input){
  const box=$('.sugg',input.parentNode),q=norm(input.value),raw=input.value.trim();
  if(!q){box.hidden=true;return}
  const have=new Set(getPath(input.closest('.picker').dataset.list)),inDeck=new Set(P.deck.map(e=>e.k));
  const hits=Object.entries(P.cards).filter(([k,c])=>!have.has(k)&&(k.includes(q)||norm(c.full).includes(q)))
    .sort((a,b)=>(b[0].startsWith(q)-a[0].startsWith(q))||(inDeck.has(b[0])-inDeck.has(a[0]))||a[1].n.localeCompare(b[1].n)).slice(0,8);
  let html=hits.map(([k,c],i)=>`<div class="opt${i?'':' on'}" data-k="${esc(k)}"><span>${esc(c.n)}</span><small>${esc(c.t.split(' — ')[0])}${inDeck.has(k)?'':' · not in the deck'}</small></div>`).join('');
  if(raw.length>=3&&!hits.some(([k])=>k===q)) html+=`<div class="opt${hits.length?'':' on'}" data-q="${esc(raw)}"><span>Find “${esc(raw)}” on Scryfall</span><small>any card</small></div>`;
  box.innerHTML=html;box.hidden=!html;
}
function addPick(path,k){
  const arr=getPath(path);if(!arr.includes(k)) arr.push(k);
  touch();renderEditor();
  const el=document.getElementById(fid(path)+'-add');if(el)el.focus({preventScroll:true});
}
async function choose(input,opt){
  const path=input.closest('.picker').dataset.list,box=$('.sugg',input.parentNode),pp=P;
  if(opt.dataset.k){addPick(path,opt.dataset.k);return}
  if(opt.dataset.pending&&ui.pending){const c=ui.pending;ui.pending=null;addPick(path,addCard(P,c));return}
  if(!opt.dataset.q) return;
  box.innerHTML='<div class="opt none">Searching…</div>';
  let c;
  try{c=await lookupOne(opt.dataset.q,t=>{box.innerHTML=`<div class="opt none">${esc(pauseMsg(t))}</div>`})}
  catch(err){if(pp!==P)return;box.innerHTML=`<div class="opt none">${esc(sfMessage(err))}</div>`;box.hidden=false;return}
  if(pp!==P) return;
  if(c&&closeName(opt.dataset.q,c)){addPick(path,addCard(P,c));return}
  if(c){ui.pending=c;box.innerHTML=`<div class="opt on" data-pending="1"><span>Did you mean “${esc(c.name)}”?</span><small>add it</small></div>`;box.hidden=false;return}
  box.innerHTML='<div class="opt none">No card found with that name.</div>';box.hidden=false;
}

/* editor events */
panel.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('pick-in')){suggest(t);return}
  const path=t.dataset.bind;if(!path) return;
  setPath(path,t.type==='checkbox'?t.checked:t.value);
  touch();
  const m=path.match(/^(combos|top)\.(\d+)\.title$/);
  if(m){const el=document.getElementById(`st-${m[1]}-${m[2]}`);if(el)el.textContent=t.value||'Untitled'}
  if(path==='title') renderPick();
  if(path==='size'){renderPreview()}
  if(path==='countdown'||/^sections\.\d+\.on$/.test(path)) renderEditor();
});
panel.addEventListener('keydown',e=>{
  const t=e.target;if(!t.classList.contains('pick-in')) return;
  const box=$('.sugg',t.parentNode),opts=$$('.opt:not(.none)',box);let i=opts.findIndex(o=>o.classList.contains('on'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!opts.length||box.hidden) return;
    i=(i+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;
    opts.forEach((o,j)=>o.classList.toggle('on',j===i));opts[i].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){e.preventDefault();if(!box.hidden&&opts[i])choose(t,opts[i])}
  else if(e.key==='Escape'){box.hidden=true}
});
panel.addEventListener('mousedown',e=>{
  const o=e.target.closest('.opt');
  if(o){e.preventDefault();if(!o.classList.contains('none'))choose($('.pick-in',o.closest('.picker')),o)}
});
panel.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('pick-in')){const box=$('.sugg',t.parentNode);setTimeout(()=>{if(document.activeElement!==t)box.hidden=true},150)}
});
panel.addEventListener('focusin',e=>{
  const it=e.target.closest&&e.target.closest('.item');if(!it) return;
  const sel=`[data-ref="${it.dataset.ref}"]`;
  if(!reveal(sel)) ui.want=sel;
});
panel.addEventListener('toggle',e=>{
  const d=e.target;
  if(d.classList&&d.classList.contains('item')){if(d.open)ui.closed.delete(d.dataset.id);else ui.closed.add(d.dataset.id)}
},true);
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b) return;
  if(b.closest('summary')) e.preventDefault();
  const a=b.dataset.act,i=+b.dataset.i,path=b.dataset.path;
  if(a==='load') loadDeck();
  else if(a==='cmd'){const en=P.deck.find(x=>x.k===b.dataset.k&&x.b===b.dataset.b);if(en){en.cmd=!en.cmd;touch();renderPick();renderEditor()}}
  else if(a==='fix') fixMissing(i);
  else if(a==='dropmiss'){P.missing.splice(i,1);touch();renderEditor()}
  else if(a==='add-combo'){P.combos.push({id:uid(),title:'',cards:[],needs:'',steps:'',result:''});touch();renderEditor();const el=document.getElementById(fid(`combos.${P.combos.length-1}.title`));if(el)el.focus()}
  else if(a==='add-top'){P.top.push({id:uid(),title:'',cards:[],text:''});touch();renderEditor();const el=document.getElementById(fid(`top.${P.top.length-1}.title`));if(el)el.focus()}
  else if(a==='add-top10'){for(let j=0;j<10;j++)P.top.push({id:uid(),title:'',cards:[],text:''});P.top.slice(1).forEach(t=>ui.closed.add(t.id));touch();renderEditor()}
  else if(a==='del'){const arr=getPath(path),[it]=arr.splice(i,1);touch();renderEditor();toast('Removed.',7000,'Undo',()=>{arr.splice(Math.min(i,arr.length),0,it);touch();renderEditor()})}
  else if(a==='up'||a==='down'){const arr=getPath(path),j=a==='up'?i-1:i+1;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];touch();renderEditor()}
  else if(a==='unpick'){getPath(path).splice(i,1);touch();renderEditor()}
});
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');if(!b) return;
  ui.tab=b.dataset.tab;renderTabs();renderEditor();panel.scrollTop=0;
  if(ui.tab==='deck'||ui.tab==='cover') reveal('');
  else if(ui.tab!=='pages') reveal(`[data-sec="${ui.tab}"]`,true);
});

/* top bar */
$('#pick').addEventListener('change',e=>openPam(e.target.value));
$('#bNew').onclick=()=>{const p=blank();DB.items[p.id]=p;ui.tab='deck';openPam(p.id);const el=$('#f-deckText');if(el)el.focus()};
$('#bDup').onclick=()=>{const p=JSON.parse(JSON.stringify(P));p.id=uid();p.updated=Date.now();delete p.example;p.title=pamName(P)+' (copy)';DB.items[p.id]=p;openPam(p.id);toast('Made a copy.')};
function resetDel(){$('#delwrap').innerHTML='<button class="btn ghost" id="bDel" type="button">Delete</button>';$('#bDel').onclick=askDel}
let delT=0;
function askDel(){
  $('#delwrap').innerHTML=`<span class="delask">Delete “${esc(pamName(P))}”? <button class="btn small danger" id="bDelYes" type="button">Yes, delete</button><button class="btn small ghost" id="bDelNo" type="button">Keep</button></span>`;
  clearTimeout(delT);delT=setTimeout(resetDel,8000);
  $('#bDelNo').onclick=()=>{clearTimeout(delT);resetDel()};
  $('#bDelYes').onclick=()=>{
    clearTimeout(delT);delete DB.items[P.id];
    let next=Object.values(DB.items).sort((a,b)=>b.updated-a.updated)[0];
    if(!next){next=blank();DB.items[next.id]=next}
    resetDel();openPam(next.id);
  };
}
$('#bDel').onclick=askDel;
$('#bSave').onclick=()=>{
  const data=JSON.stringify({app:'deck-pamphlets',v:1,pamphlet:P},null,1);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=(pamName(P).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'deck')+'.pamphlet.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Saved as a file. Open it on your other computer with “Open file”.',6000);
};
$('#bOpen').onclick=()=>$('#file').click();
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f) return;
  try{
    const j=JSON.parse(await f.text()),p=j&&j.app==='deck-pamphlets'&&j.pamphlet;
    if(!p||typeof p!=='object'||!Array.isArray(p.deck)) throw new Error('not a pamphlet');
    migrate(p);p.id=p.id||uid();
    const mine=DB.items[p.id];
    if(mine&&(mine.updated||0)>(p.updated||0)){p.id=uid();p.title=pamName(p)+' (from file)';toast('The copy in this browser is newer, so the file was opened as a separate pamphlet.',7000)}
    else toast(mine?'Opened. It replaced the older copy in this browser.':'Opened.',5000);
    DB.items[p.id]=p;openPam(p.id);
  }catch(err){toast('That file is not a pamphlet saved from this app.',6000)}
});
$('#bMore').onclick=()=>{const on=document.body.classList.toggle('more');$('#bMore').setAttribute('aria-expanded',on)};
$('#bView').onclick=()=>{const on=document.body.classList.toggle('pv');$('#bView').textContent=on?'Edit':'Preview';if(on)fitPreview()};
async function toPdf(){
  renderPreview();
  toast('Getting the pages ready…',15000);
  try{await document.fonts.ready}catch(e){}
  const imgs=$$('#pages img').filter(im=>!im.complete);
  await Promise.race([Promise.all(imgs.map(im=>new Promise(r=>{im.addEventListener('load',r,{once:true});im.addEventListener('error',r,{once:true})}))),sleep(12000)]);
  renderPreview();
  toast('In the print window, choose “Save as PDF” as the printer.',9000);
  const old=document.title;document.title=pamName(P);
  window.addEventListener('afterprint',()=>{document.title=old},{once:true});
  await sleep(60);window.print();
}
$('#bPdf').onclick=toPdf;
window.addEventListener('resize',fitPreview);
window.addEventListener('beforeunload',()=>{clearTimeout(saveT);saveNow()});

renderAll();saveNow();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>renderPreview());
if(document.fonts) document.fonts.addEventListener('loadingdone',()=>schedulePreview());
window.__dp={parseDeck,loadDeck,renderPreview,renderAll,get P(){return P},get DB(){return DB},ui};
})();
</script>
</body>
</html>
